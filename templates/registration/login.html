<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f6fb; margin: 0;
           display: grid; place-items: center; min-height: 100vh; }
    .card { background: #fff; padding: 32px; border-radius: 16px; width: 320px;
            box-shadow: 0 10px 40px rgba(30, 30, 80, .08); }
    h1 { font-size: 20px; margin: 0 0 16px; }
    label { display: block; font-size: 13px; margin: 12px 0 4px; }
    input { width: 100%; padding: 10px; border: 1px solid #d5d9ec; border-radius: 8px;
            box-sizing: border-box; }
    button { width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 8px;
             background: #5b5ce2; color: #fff; font-weight: 600; cursor: pointer; }
    .error { color: #c0392b; font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>
  <form class="card" method="post">
    {% csrf_token %}
    <h1>Iniciar sesión</h1>
    {% if form.errors %}<p class="error">Usuario o contraseña incorrectos.</p>{% endif %}
    <label for="id_username">Usuario</label>
    {{ form.username }}
    <label for="id_password">Contraseña</label>
    {{ form.password }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
