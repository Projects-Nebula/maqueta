{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compra cancelada</title>
  <link rel="stylesheet" href="{% static 'shared/tokens.css' %}">
  <style>
    * { box-sizing: border-box; }
    body { font-family: var(--font-sans); color: var(--text); background: var(--app-bg); margin: 0;
           display: grid; place-items: center; min-height: 100vh; padding: 16px; }
    .card { background: var(--panel-bg); border: 1px solid var(--border); padding: 32px;
            border-radius: var(--radius); width: min(320px, 100%); text-align: center; box-shadow: var(--shadow); }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { color: var(--muted); font-size: 14px; }
    a { display: inline-block; margin-top: 12px; padding: 11px 20px; border-radius: 8px;
        background: var(--primary); color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Compra cancelada</h1>
    <p>No se realizó ningún cargo.</p>
    <a href="/">Volver al inicio</a>
  </div>
</body>
</html>
