<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compra cancelada</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f6fb; margin: 0;
           display: grid; place-items: center; min-height: 100vh; }
    .card { background: #fff; padding: 32px; border-radius: 16px; width: 320px;
            text-align: center; box-shadow: 0 10px 40px rgba(30, 30, 80, .08); }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { color: #6b7094; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Compra cancelada</h1>
    <p>No se realizó ningún cargo.</p>
  </div>
</body>
</html>
