{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis productos</title>
  <link rel="stylesheet" href="{% static 'shared/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'shared/feedback.css' %}">
  <link rel="stylesheet" href="{% static 'shared/navigation.css' %}">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--app-bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.5;
    }
    .products-header { text-align: center; padding: 56px 24px 32px; }
    .products-header h1 { margin: 0 0 8px; font-size: 32px; }
    .products-header p { margin: 0; color: var(--muted); font-size: 15px; }
    .products-header > a { display: inline-block; margin-top: 12px; color: var(--text); font-size: 14px; }
    main { max-width: 720px; margin: 0 auto; padding: 0 24px 64px; }
    .product-form, .product-row {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .field { display: block; margin-bottom: 12px; }
    .field > span:not(.file-control) { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .control {
      width: 100%; padding: 9px 11px; border: 1px solid var(--border);
      border-radius: 8px; font: inherit; font-size: 13px;
    }
    .btn {
      padding: 10px 16px; border: 0; border-radius: 8px; font: inherit;
      font-weight: 600; cursor: pointer; background: var(--panel-soft); color: var(--text);
    }
    .btn.primary { background: var(--primary); color: #fff; }
    .btn.danger { background: color-mix(in srgb, var(--danger) 8%, white); color: var(--danger); }
    .product-row { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; }
    .product-row img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; }
    .product-info { flex: 1; min-width: 160px; }
    .product-info h3 { margin: 0 0 4px; font-size: 15px; }
    .product-info p { margin: 0; color: var(--muted); font-size: 13px; }
    .empty-state { text-align: center; color: var(--muted); padding: 32px 24px; }
    .empty-state-action { color: var(--primary); font-weight: 700; }
    .product-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
    .btn:disabled { cursor: wait; opacity: .55; }
    .field-help { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    @media (max-width: 520px) {
      .products-header { padding: 36px 16px 24px; }
      .products-header h1 { font-size: 28px; }
      main { padding-right: 16px; padding-left: 16px; }
      .product-actions { width: 100%; margin-left: 0; }
      .product-actions .btn { flex: 1 1 0; }
    }
  </style>
</head>
<body>
  <header class="products-header">
    <h1>Mis productos</h1>
    <p>Creá productos para vender en tus páginas publicadas.</p>
    <nav class="site-nav" aria-label="Navegación principal">
      <a href="{% url 'editor:home' %}">Templates base</a>
      <a href="{% url 'editor:gallery' %}">Mis templates</a>
      <a href="{% url 'analytics:dashboard' %}">Analítica</a>
      <a href="{% url 'storefront:products' %}" aria-current="page">Mis productos</a>
      <a href="{% url 'storefront:payment-config' %}">Pasarelas de pago</a>
    </nav>
  </header>

  <main>
    <div id="appFeedback" class="app-feedback" role="status" aria-live="polite" aria-atomic="true"></div>
    <form class="product-form" id="productForm">
      <label class="field"><span>Nombre</span><input class="control" id="productName" type="text" required></label>
      <label class="field"><span>Descripción</span><textarea class="control" id="productDescription"></textarea></label>
      <label class="field"><span>Precio (en centavos, ej. 1999 = $19.99)</span><input class="control" id="productPrice" type="number" min="1" required></label>
      <label class="field"><span>Imagen (opcional)</span><span class="file-control"><input id="productImage" type="file" accept="image/*"><span class="file-control-button">Elegir imagen</span><span class="file-control-name" data-file-name="productImage">Ningún archivo seleccionado</span></span></label>
      <label class="field"><span>Archivo descargable (PDF/ZIP, opcional)</span><span class="file-control"><input id="productFile" type="file" accept=".pdf,.zip"><span class="file-control-button">Elegir archivo</span><span class="file-control-name" data-file-name="productFile">Ningún archivo seleccionado</span></span><small class="field-help">Formatos permitidos: PDF o ZIP.</small></label>
      <button class="btn primary" id="createProductButton" type="submit">Crear producto</button>
    </form>

    <div id="productList" aria-live="polite" aria-busy="true"></div>
  </main>

  <script src="{% static 'shared/feedback.js' %}"></script>
  <script src="{% static 'storefront/products.js' %}"></script>
</body>
</html>
