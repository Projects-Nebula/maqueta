{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuenta de Hotmart</title>
  <link rel="stylesheet" href="{% static 'shared/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'shared/feedback.css' %}">
  <link rel="stylesheet" href="{% static 'shared/navigation.css' %}">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--app-bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.5;
    }
    .hotmart-header { text-align: center; padding: 56px 24px 32px; }
    .hotmart-header h1 { margin: 0 0 8px; font-size: 32px; }
    .hotmart-header p { margin: 0; color: var(--muted); font-size: 15px; }
    main { max-width: 560px; margin: 0 auto; padding: 0 24px 64px; }
    .connection-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      text-align: center;
    }
    .connection-status { font-size: 15px; font-weight: 700; margin: 0 0 16px; }
    .connection-status.connected { color: var(--success); }
    .connection-status.disconnected { color: var(--muted); }
    .btn {
      padding: 10px 18px; border: 0; border-radius: 8px; font: inherit;
      font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block;
    }
    .btn.primary { background: var(--primary); color: #fff; }
    .btn.danger { background: #d33; color: #fff; }
    .btn:disabled { cursor: wait; opacity: .55; }
  </style>
</head>
<body>
  <header class="hotmart-header">
    <h1>Cuenta de Hotmart</h1>
    <p>Conectá tu cuenta de Hotmart para vincular tus productos con tus landings.</p>
    <nav class="site-nav" aria-label="Navegación principal">
      <a href="{% url 'editor:home' %}">Templates base</a>
      <a href="{% url 'editor:gallery' %}">Mis templates</a>
      <a href="{% url 'storefront:products' %}">Mis productos</a>
      <a href="{% url 'hotmart:connection' %}" aria-current="page">Hotmart</a>
    </nav>
  </header>

  <main>
    <div id="appFeedback" class="app-feedback" role="status" aria-live="polite" aria-atomic="true"></div>
    <div class="connection-card">
      {% if connected %}
        <p class="connection-status connected">Conectado ✓</p>
        <button id="disconnectBtn" class="btn danger" type="button">Desconectar cuenta</button>
      {% else %}
        <p class="connection-status disconnected">No conectado</p>
        <a class="btn primary" href="{% url 'hotmart:connect' %}">Conectar cuenta de Hotmart</a>
      {% endif %}
    </div>
  </main>

  <script src="{% static 'shared/feedback.js' %}"></script>
  <script src="{% static 'hotmart/connection.js' %}"></script>
</body>
</html>
